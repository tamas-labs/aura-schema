name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    javascript:
        name: JavaScript (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20', '22']
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            # Fails when schema/*.json changed but the generated files did not.
            - run: npm run quality

            - run: npm run build

    php:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - run: composer validate --strict

            # The package ships no Composer dependencies, so there is nothing to
            # install — the smoke script runs straight off the checkout.
            - run: php php/smoke.php
